# Publish v2 to the existing repository's GitHub Pages site.
name: Deploy HorseBook v2 to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rebuild
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: rebuild/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Database behavior checks
        run: npm test
      - name: Install browser for checks
        run: npx playwright install --with-deps chromium
      - name: Browser checks
        run: npm run test:ui
      - name: Build
        run: npm run build
        env:
          # Public browser configuration only, explicitly targeting the v2 DB.
          VITE_SUPABASE_URL: https://kdnhvunmtfqfkhcxtlqp.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable__0qsAS8dUo3Pq56gOzNtGw_3-lZGCBt
          VITE_LOCAL_TEST_MODE: 'false'
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './rebuild/dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
